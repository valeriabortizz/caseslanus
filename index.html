<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASES LANUS — Accesorios para iPhone</title>
<link rel="icon" href="assets/brand/logo.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="brand-backdrop" id="brandBackdrop" hidden></div>
  <div class="brand-popover" id="brandPopover" hidden>
    <button class="popover-close" id="popoverClose" aria-label="Cerrar">✕</button>
    <img src="assets/brand/logo.jpg" alt="Cases Lanús">
    <h3>Cases Lanús</h3>
    <p>Accesorios para iPhone en Lanús</p>
  </div>

  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <span class="brand">
        <img class="brand-logo" src="assets/brand/logo.jpg" alt="Cases Lanús">
        CASES<span class="brand-dot">·</span>LANUS
      </span>

      <nav class="tabs" id="tabs">
        <button class="tab" data-target="cargadores">Cargadores</button>
        <button class="tab" data-target="auriculares">Auriculares</button>
        <button class="tab" data-target="vidrios">Vidrios</button>
        <button class="tab" data-target="accesorios">Accesorios</button>
      </nav>

      <button class="model-chip" id="modelChip" aria-label="Cambiar modelo de iPhone"></button>
    </div>
  </header>

  <!-- Pantalla de preguntas inicial -->
  <section class="gate" id="gate">
    <div class="gate-inner">
      <img class="gate-logo" src="assets/brand/logo.jpg" alt="Cases Lanús">
      <p class="eyebrow">Cases Lanus</p>
      <h1>Accesorios para tu iPhone</h1>
      <p class="lede">Contanos qué tenés y qué necesitás. Te mostramos solo lo que sirve para tu equipo.</p>

      <div class="field">
        <label for="modelSelect">¿Qué iPhone tenés?</label>
        <select id="modelSelect">
          <option value="" disabled selected>Elegí tu modelo</option>
          <option value="11">iPhone 11</option>
          <option value="12">iPhone 12</option>
          <option value="13">iPhone 13</option>
          <option value="14">iPhone 14</option>
          <option value="15">iPhone 15</option>
          <option value="16">iPhone 16</option>
          <option value="17">iPhone 17</option>
          <option value="otro">Otro modelo</option>
        </select>
      </div>

      <div class="field">
        <p class="field-label">¿Qué necesitás?</p>
        <div class="need-grid" id="needGrid">
          <button class="need-btn" data-target="cargadores" disabled>
            <span class="need-title">Cargadores</span>
            <span class="need-sub">Cables y fuentes</span>
          </button>
          <button class="need-btn" data-target="auriculares" disabled>
            <span class="need-title">Auriculares</span>
            <span class="need-sub">Con y sin cable</span>
          </button>
          <button class="need-btn" data-target="vidrios" disabled>
            <span class="need-title">Vidrios</span>
            <span class="need-sub">Templados y de cámara</span>
          </button>
          <button class="need-btn" data-target="accesorios" disabled>
            <span class="need-title">Accesorios</span>
            <span class="need-sub">Fundas y más</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Contenido principal -->
  <main id="catalog" hidden>

    <section class="panel" id="cargadores">
      <div class="panel-inner">
        <h2>Cargadores</h2>
        <p class="panel-note" data-note></p>
        <div class="grid" data-grid></div>
      </div>
    </section>

    <section class="panel" id="auriculares">
      <div class="panel-inner">
        <h2>Auriculares</h2>
        <p class="panel-note" data-note></p>
        <div class="grid" data-grid></div>
      </div>
    </section>

    <section class="panel" id="vidrios">
      <div class="panel-inner">
        <h2>Vidrios</h2>
        <p class="panel-note" data-note></p>
        <div class="grid" data-grid></div>
      </div>
    </section>

    <section class="panel" id="accesorios">
      <div class="panel-inner">
        <h2>Accesorios</h2>
        <p class="panel-note" data-note></p>
        <div class="grid" data-grid></div>
      </div>
    </section>

  </main>

  <footer class="footer" id="footer" hidden>
    <p>CASES LANUS — Accesorios para iPhone</p>
  </footer>

  <script src="products.js"></script>
  <script src="script.js"></script>
</body>
</html>
